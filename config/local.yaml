environment: local
device: auto
random_seed: 42
dataset:
  max_documents: 100000
  working_document_limit: 1000
  max_file_size_mb: 25
  min_extracted_characters: 20
  recursive: true
ingestion:
  output_format: jsonl
  output_path: processed/documents.jsonl
  manifest_dir: ingestion
  preview_characters: 2000
  preview_documents: 20
  max_extracted_characters: 2000000
  max_docx_uncompressed_mb: 50
  progress_interval: 100
  max_upload_files: 20
  max_upload_total_mb: 50
csv:
  mode: rows
  text_columns: []
preprocessing:
  unicode_normalization: NFC
  normalize_whitespace: true
  max_consecutive_blank_lines: 2
  preserve_case: true
  preserve_punctuation: true
  strip_control_characters: true
  normalize_nonbreaking_spaces: true
  min_characters: 50
  max_characters_per_document: 200000
  min_alpha_ratio: 0.20
  max_control_ratio: 0.01
  max_repeated_character_run: 1000
  long_document_policy: truncate
  preview_characters: 1000
  preview_documents: 20
  progress_interval: 100
split:
  train_ratio: 0.80
  validation_ratio: 0.10
  test_ratio: 0.10
tokenizer:
  type: wordpiece
  vocab_size: 8000
model:
  context_length: 128
  embedding_dim: 192
  num_layers: 3
  num_heads: 4
  feedforward_dim: 768
  dropout: 0.1
training:
  batch_size: 4
  epochs: 2
  gradient_accumulation_steps: 1
  mixed_precision: false
  num_workers: 1
