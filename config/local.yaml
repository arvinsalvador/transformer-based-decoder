environment: local
device: auto
random_seed: 42
dataset:
  max_documents: 100000
  working_document_limit: 1000
  max_file_size_mb: 25
  min_extracted_characters: 20
  recursive: true
ingestion:
  output_format: jsonl
  output_path: processed/documents.jsonl
  manifest_dir: ingestion
  preview_characters: 2000
  preview_documents: 20
  max_extracted_characters: 2000000
  max_docx_uncompressed_mb: 50
  progress_interval: 100
  max_upload_files: 20
  max_upload_total_mb: 50
csv:
  mode: rows
  text_columns: []
tokenizer:
  type: wordpiece
  vocab_size: 8000
model:
  context_length: 128
  embedding_dim: 192
  num_layers: 3
  num_heads: 4
  feedforward_dim: 768
  dropout: 0.1
training:
  batch_size: 4
  epochs: 2
  gradient_accumulation_steps: 1
  mixed_precision: false
  num_workers: 1
