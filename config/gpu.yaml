environment: gpu
device: cuda
random_seed: 42
dataset:
  max_documents: 100000
  working_document_limit: 100000
  max_file_size_mb: 100
  min_extracted_characters: 20
  recursive: true
ingestion:
  output_format: jsonl
  output_path: processed/documents.jsonl
  manifest_dir: ingestion
  preview_characters: 2000
  preview_documents: 20
  max_extracted_characters: 8000000
  max_docx_uncompressed_mb: 100
  progress_interval: 1000
  max_upload_files: 20
  max_upload_total_mb: 50
csv:
  mode: rows
  text_columns: []
preprocessing:
  unicode_normalization: NFC
  normalize_whitespace: true
  max_consecutive_blank_lines: 2
  preserve_case: true
  preserve_punctuation: true
  strip_control_characters: true
  normalize_nonbreaking_spaces: true
  min_characters: 50
  max_characters_per_document: 500000
  min_alpha_ratio: 0.20
  max_control_ratio: 0.01
  max_repeated_character_run: 1000
  long_document_policy: truncate
  preview_characters: 1000
  preview_documents: 20
  progress_interval: 1000
split:
  train_ratio: 0.80
  validation_ratio: 0.10
  test_ratio: 0.10
tokenizer:
  type: wordpiece
  vocab_size: 12000
  min_frequency: 2
  continuing_subword_prefix: "##"
  special_tokens: ["[PAD]", "[UNK]", "[BOS]", "[EOS]"]
  unk_token: "[UNK]"
  pad_token: "[PAD]"
  bos_token: "[BOS]"
  eos_token: "[EOS]"
  lowercase: false
  max_input_characters_per_word: 100
  training_batch_documents: 1000
trigram:
  storage_backend: sqlite
  smoothing: add_k
  add_k: 0.1
  min_count: 1
  generation:
    strategy: greedy
    max_new_tokens: 100
    temperature: 1.0
    top_k: 50
model:
  context_length: 256
  embedding_dim: 256
  num_layers: 4
  num_heads: 4
  feedforward_dim: 1024
  dropout: 0.1
  positional_embedding: learned
  layer_norm_eps: 1.0e-5
  bias: true
  tie_embeddings: true
  initialization_std: 0.02
training:
  batch_size: 16
  epochs: 3
  gradient_accumulation_steps: 1
  mixed_precision: true
  num_workers: 4
