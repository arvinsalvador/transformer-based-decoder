environment: gpu
evaluation:
  document_limit: null
  transformer_batch_size: 32
  precision: auto
  gpu_warmup_batches: 1
  generation:
    strategy: greedy
    max_new_tokens: 50
    temperature: 1.0
    top_k: 50
device: cuda
random_seed: 42
dataset:
  max_documents: 100000
  working_document_limit: 100000
  # Supplied SUROY CSV is ~118 MiB; document cap remains 100,000.
  max_file_size_mb: 128
  min_extracted_characters: 20
  recursive: true
ingestion:
  output_format: jsonl
  output_path: processed/documents.jsonl
  manifest_dir: ingestion
  preview_characters: 2000
  preview_documents: 20
  max_extracted_characters: 8000000
  max_docx_uncompressed_mb: 100
  progress_interval: 1000
  max_upload_files: 20
  max_upload_total_mb: 50
csv:
  mode: rows
  text_columns: []
preprocessing:
  unicode_normalization: NFC
  normalize_whitespace: true
  max_consecutive_blank_lines: 2
  preserve_case: true
  preserve_punctuation: true
  strip_control_characters: true
  normalize_nonbreaking_spaces: true
  min_characters: 50
  max_characters_per_document: 500000
  min_alpha_ratio: 0.20
  max_control_ratio: 0.01
  max_repeated_character_run: 1000
  long_document_policy: truncate
  preview_characters: 1000
  preview_documents: 20
  progress_interval: 1000
split:
  train_ratio: 0.80
  validation_ratio: 0.10
  test_ratio: 0.10
tokenizer:
  type: wordpiece
  vocab_size: 12000
  min_frequency: 2
  continuing_subword_prefix: "##"
  special_tokens: ["[PAD]", "[UNK]", "[BOS]", "[EOS]"]
  unk_token: "[UNK]"
  pad_token: "[PAD]"
  bos_token: "[BOS]"
  eos_token: "[EOS]"
  lowercase: false
  max_input_characters_per_word: 100
  training_batch_documents: 1000
trigram:
  storage_backend: sqlite
  smoothing: add_k
  add_k: 0.1
  min_count: 1
  generation:
    strategy: greedy
    max_new_tokens: 100
    temperature: 1.0
    top_k: 50
model:
  context_length: 256
  embedding_dim: 256
  num_layers: 4
  num_heads: 4
  feedforward_dim: 1024
  dropout: 0.1
  positional_embedding: learned
  layer_norm_eps: 1.0e-5
  bias: true
  tie_embeddings: true
  initialization_std: 0.02
training:
  batch_size: 16
  epochs: 3
  gradient_accumulation_steps: 1
  mixed_precision: true
  num_workers: 4
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-8
  scheduler: cosine
  warmup_steps: 20
  min_learning_rate_ratio: 0.1
  max_grad_norm: 1.0
  precision: auto
  pin_memory: true
  persistent_workers: true
  shuffle_buffer_size: 10000
  sequence_stride: 256
  logging_steps: 50
  deterministic: false
  max_steps: null
  checkpoint:
    save_every_steps: 1000
    save_every_epoch: true
    keep_last_n: 3
  early_stopping:
    enabled: true
    patience: 2
    min_delta: 0.0
